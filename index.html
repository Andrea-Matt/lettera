function open(key, b64) {
  const raw = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
  const tag = raw.subarray(0, 16), ct = raw.subarray(16);
  const mac = hmac(H("m", key), ct);
  for (let i = 0; i < 16; i++) if (mac[i] !== tag[i]) return null;
  const pt = new Uint8Array(ct.length);
  for (let i = 0; i < ct.length; i += 32) {
    const ks = H("s", key, i / 32);
    for (let j = 0; j < 32 && i + j < ct.length; j++) pt[i + j] = ct[i + j] ^ ks[j];
  }
  return JSON.parse(new TextDecoder().decode(pt));
}
const N = BigInt("0x" + D.N);
const worker = new Worker(URL.createObjectURL(new Blob([`
  onmessage = e => {
    let x = BigInt(e.data.x); const N = BigInt(e.data.N), T = e.data.T;
    for (let i = 0; i < T;) {
      const m = Math.min(20000, T - i);
      for (let j = 0; j < m; j++) x = x * x % N;
      i += m; postMessage({ done: i });
    }
    postMessage({ y: x.toString(16) });
  };`], { type: "text/javascript" })));
let busy = Promise.resolve();
function puzzle(seed, T, where) {
  const x0 = BigInt("0x" + hex(cat(H("x", seed), H("y", seed)))) % N;
  const x = x0 < 2n ? 2n : x0;
  const bar = $("div", "wait"), fill = $("i"); bar.append(fill); where.append(bar);
  const job = busy.then(() => new Promise(ok => {
    worker.onmessage = e => {
      if (e.data.done) fill.style.width = (100 * e.data.done / T) + "%";
      if (e.data.y) { bar.remove(); ok(unhex(e.data.y.padStart(2 * 256, "0"))); }
    };
    worker.postMessage({ x: "0x" + x.toString(16), N: "0x" + D.N, T });
  }));
  busy = job;
  return job;
}
const KEY = "p-" + D.id;
let S = { ys: {} };
try { S = JSON.parse(localStorage.getItem(KEY)) || S; } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };
let audio = null;
function wake() { try { audio = audio || new AudioContext(); audio.resume(); } catch (e) {} }
addEventListener("pointerdown", wake); addEventListener("keydown", wake);
const $ = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const pause = s => new Promise(ok => setTimeout(ok, s * 1000));
const page = document.getElementById("page");
const front = $("div", "front"); page.append(front);
function code() {
  return new Promise(done => {
    for (const it of D.front) {
      if (it.kind === "prose") { front.append($("p", null, it.text)); continue; }
      if (S.ys[0]) continue;
      const box = $("div", "code"), lab = $("label", null, it.text), inp = $("input"), btn = $("button", null, "Inizia");
      const msg = $("div", "msg");
      inp.inputMode = "numeric"; inp.autocomplete = "off"; inp.maxLength = 5;
      box.append(lab, inp, btn, msg); front.append(box);
      const go = async () => {
        const c = inp.value.trim();
        if (!/^\d{5}$/.test(c)) { msg.textContent = "Il codice ha cinque cifre."; return; }
        wake(); btn.disabled = inp.disabled = true; msg.textContent = "";
        await pause(.05);
        const k0 = pbkdf2(utf8(c), unhex(D.salt), D.iter);
        const y = await puzzle(H("0", k0), D.T, box);
        if (!open(H("k", 0, y), D.c[0])) {
          msg.textContent = "Questo codice non apre la lettera. Riprova.";
          btn.disabled = inp.disabled = false; inp.select(); return;
        }
        S.ys[0] = hex(y); save(); box.remove(); done();
      };
      btn.onclick = go; inp.onkeydown = e => { if (e.key === "Enter") go(); };
    }
    if (S.ys[0]) done();
  });
}
(async () => {
  await code();
  const P = open(H("k", 0, unhex(S.ys[0])), D.c[0]);
  const style = document.createElement("style"); style.textContent = P.css; document.head.append(style);
  new Function("ctx", P.js)({ D, S, P, save, puzzle, open, H, hex, unhex, page, $, pause, audio: () => audio });
})();
</script>
